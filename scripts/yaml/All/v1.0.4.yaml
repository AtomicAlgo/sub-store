mode: rule

# ============================================================
# Mihomo 基础性能参数
# ============================================================

unified-delay: true
tcp-concurrent: true
find-process-mode: always


# ============================================================
# Proxy Groups
# Sub-Store 负责产生 proxies
# 本配置负责根据节点名称进行动态地区分类
# ============================================================
proxy-groups:

  # ==========================================================
  # 总入口
  # 默认日常使用香港
  # ==========================================================

  - name: 节点选择
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    default-selected: 香港节点
    proxies:
      - 香港节点
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 美国节点
      - 韩国节点
      - 泰国节点
      - 德国节点
      - 法国节点
      - 英国节点
      - 澳洲节点
      - 其他节点
      - 手动切换
      - DIRECT


  # ==========================================================
  # 香港
  # ==========================================================

  - name: 香港节点
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"
    include-all-proxies: true
    filter: "(?i)(香港|Hong\\s?Kong|\\bHK\\b|\\bHKG\\b|🇭🇰)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT


  # ==========================================================
  # 台湾
  # ==========================================================

  - name: 台湾节点
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"
    include-all-proxies: true
    filter: "(?i)(台湾|台北|新北|Taiwan|Taipei|New\\s?Taipei|\\bTW\\b|\\bTWN\\b|\\bTPE\\b|🇹🇼)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT


  # ==========================================================
  # 日本
  # ==========================================================

  - name: 日本节点
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"
    include-all-proxies: true
    filter: "(?i)(日本|Japan|东京|Tokyo|大阪|Osaka|\\bJP\\b|\\bJPN\\b|\\bNRT\\b|\\bHND\\b|\\bKIX\\b|🇯🇵)"
    exclude-filter: "(?i)(尼日利亚|剩余|流量|套餐|到期|重置|官网|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT


  # ==========================================================
  # 新加坡
  # ==========================================================

