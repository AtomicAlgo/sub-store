  - name: 其他节点
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
    include-all-proxies: true

    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire|Expired|Reset|Quota|香港|Hong\\s?Kong|\\bHK\\b|\\bHKG\\b|🇭🇰|台湾|台北|Taiwan|Taipei|\\bTW\\b|\\bTWN\\b|\\bTPE\\b|🇹🇼|日本|Japan|Tokyo|Osaka|\\bJP\\b|\\bJPN\\b|🇯🇵|新加坡|狮城|Singapore|\\bSG\\b|\\bSGP\\b|🇸🇬|美国|United\\s?States|Los\\s?Angeles|\\bUS\\b|\\bUSA\\b|\\bLAX\\b|🇺🇸|韩国|Korea|Seoul|\\bKR\\b|\\bKOR\\b|🇰🇷|泰国|Thailand|Bangkok|\\bTH\\b|\\bTHA\\b|🇹🇭|德国|Germany|Frankfurt|\\bDE\\b|\\bDEU\\b|🇩🇪|法国|France|Paris|\\bFR\\b|🇫🇷|英国|United\\s?Kingdom|London|\\bUK\\b|\\bGBR\\b|🇬🇧|澳洲|澳大利亚|Australia|Sydney|Melbourne|\\bAU\\b|\\bAUS\\b|🇦🇺)"

