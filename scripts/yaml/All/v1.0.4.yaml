    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"
    include-all-proxies: true
    filter: "(?i)(新加坡|狮城|Singapore|\\bSG\\b|\\bSGP\\b|\\bSIN\\b|🇸🇬)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT


