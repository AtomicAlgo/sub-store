    include-all-proxies: true
    filter: "(?i)(美国|United\\s?States|New\\s?York|纽约|Los\\s?Angeles|洛杉矶|San\\s?Jose|圣何塞|San\\s?Francisco|旧金山|Seattle|西雅图|Chicago|芝加哥|Dallas|达拉斯|Silicon\\s?Valley|硅谷|\\bUS\\b|\\bUSA\\b|\\bLAX\\b|\\bSFO\\b|\\bSJC\\b|\\bSEA\\b|🇺🇸)"
