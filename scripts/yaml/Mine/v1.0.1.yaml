mode: rule

# 这个暂时没有修改，只有一个没有必要


unified-delay: true
tcp-concurrent: true
find-process-mode: always

proxy-groups:

  - name: 节点选择
    type: select
    default-selected: 香港节点
    proxies:
      - 香港节点
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 美国节点
      - 韩国节点
      - 英国节点
      - 澳洲节点
      - 其他节点
      - 手动切换
      - DIRECT

  - name: 香港节点
    type: select
    include-all-proxies: true
    filter: "(?i)(香港|Hong\\s?Kong|\\bHK\\b|\\bHKG\\b|🇭🇰)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 台湾节点
    type: select
    include-all-proxies: true
    filter: "(?i)(台湾|台北|新北|Taiwan|Taipei|New\\s?Taipei|\\bTW\\b|\\bTWN\\b|\\bTPE\\b|🇹🇼)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 日本节点
    type: select
    include-all-proxies: true
    filter: "(?i)(日本|Japan|东京|Tokyo|大阪|Osaka|\\bJP\\b|\\bJPN\\b|\\bNRT\\b|\\bHND\\b|\\bKIX\\b|🇯🇵)"
    exclude-filter: "(?i)(尼日利亚|剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 狮城节点
    type: select
    include-all-proxies: true
    filter: "(?i)(新加坡|狮城|Singapore|\\bSG\\b|\\bSGP\\b|\\bSIN\\b|🇸🇬)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 美国节点
    type: select
    include-all-proxies: true
    filter: "(?i)(美国|United\\s?States|New\\s?York|纽约|Los\\s?Angeles|洛杉矶|San\\s?Jose|圣何塞|San\\s?Francisco|旧金山|Seattle|西雅图|Chicago|芝加哥|Dallas|达拉斯|\\bUS\\b|\\bUSA\\b|\\bLAX\\b|\\bSFO\\b|\\bSJC\\b|\\bSEA\\b|🇺🇸)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 韩国节点
    type: select
    include-all-proxies: true
    filter: "(?i)(韩国|南韩|首尔|Seoul|Korea|\\bKR\\b|\\bKOR\\b|\\bICN\\b|🇰🇷)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 英国节点
    type: select
    include-all-proxies: true
    filter: "(?i)(英国|United\\s?Kingdom|Britain|Great\\s?Britain|London|伦敦|\\bUK\\b|\\bGB\\b|\\bGBR\\b|\\bLHR\\b|🇬🇧)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  - name: 澳洲节点
    type: select
    include-all-proxies: true
    filter: "(?i)(澳洲|澳大利亚|Australia|Sydney|悉尼|Melbourne|墨尔本|\\bAU\\b|\\bAUS\\b|\\bSYD\\b|\\bMEL\\b|🇦🇺)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"
    empty-fallback: DIRECT

  # 泰国、德国、法国，以及其他没有独立分类的国家都进入这里
  - name: 其他节点
    type: select
    include-all-proxies: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota|香港|Hong\\s?Kong|\\bHK\\b|\\bHKG\\b|🇭🇰|台湾|台北|Taiwan|Taipei|\\bTW\\b|\\bTWN\\b|\\bTPE\\b|🇹🇼|日本|Japan|Tokyo|Osaka|\\bJP\\b|\\bJPN\\b|🇯🇵|新加坡|狮城|Singapore|\\bSG\\b|\\bSGP\\b|🇸🇬|美国|United\\s?States|Los\\s?Angeles|\\bUS\\b|\\bUSA\\b|\\bLAX\\b|🇺🇸|韩国|Korea|Seoul|\\bKR\\b|\\bKOR\\b|🇰🇷|英国|United\\s?Kingdom|London|\\bUK\\b|\\bGBR\\b|🇬🇧|澳洲|澳大利亚|Australia|Sydney|Melbourne|\\bAU\\b|\\bAUS\\b|🇦🇺)"
    empty-fallback: DIRECT

  # 手动切换不做倍率过滤
  # FlClash 自动测速脚本也必须跳过这个组
  - name: 手动切换
    type: select
    include-all-proxies: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|公告|Traffic|Expire|Expired|Reset|Quota)"

  - name: AI服务
    type: select
    default-selected: 节点选择
    proxies:
      - 节点选择
      - 美国节点
      - 日本节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 英国节点
      - 澳洲节点
      - 其他节点
      - DIRECT

  - name: 流媒体
    type: select
    default-selected: 节点选择
    proxies:
      - 节点选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 韩国节点
      - 美国节点
      - 英国节点
      - 澳洲节点
      - 其他节点
      - DIRECT

  - name: 游戏平台
    type: select
    default-selected: 节点选择
    proxies:
      - 节点选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 韩国节点
      - 美国节点
      - 其他节点
      - DIRECT

  - name: Google服务
    type: select
    default-selected: 节点选择
    proxies:
      - 节点选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 韩国节点
      - 美国节点
      - 英国节点
      - 其他节点
