rule-providers:

  U_ADBLOCK:
    type: http
    behavior: classical
    format: text
    interval: 86400
    path: "./ruleset/U_ADBLOCK.list"
    url: "https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/Loon/rule/rejectAd.list"

  U_GFW:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: "./ruleset/U_GFW.mrs"
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/gfw.mrs"

  U_CN_DOMAIN:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: "./ruleset/U_CN_DOMAIN.mrs"
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"

  U_CN_IP:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: "./ruleset/U_CN_IP.mrs"
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"

  U_AI:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: "./ruleset/U_AI.mrs"
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.mrs"


rules:

  # LAN
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT

  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 广告
  - RULE-SET,U_ADBLOCK,REJECT

  # Google 中国域名特殊代理
  - DOMAIN-SUFFIX,googleapis.cn,Google服务
  - DOMAIN-SUFFIX,services.googleapis.cn,Google服务
  - DOMAIN-SUFFIX,gstatic.cn,Google服务
  - DOMAIN-KEYWORD,googleusercontent,Google服务
  - DOMAIN-KEYWORD,xn--ngstr-lra8j,Google服务

  # AI
  - RULE-SET,U_AI,AI服务
  - DOMAIN-SUFFIX,openai.com,AI服务
  - DOMAIN-SUFFIX,chatgpt.com,AI服务
  - DOMAIN-SUFFIX,oaistatic.com,AI服务
  - DOMAIN-SUFFIX,oaiusercontent.com,AI服务
  - DOMAIN-SUFFIX,anthropic.com,AI服务
  - DOMAIN-SUFFIX,claude.ai,AI服务
  - DOMAIN-SUFFIX,perplexity.ai,AI服务

  # Streaming
  - GEOSITE,youtube,流媒体
  - GEOSITE,netflix,流媒体
  - GEOSITE,spotify,流媒体
  - GEOSITE,twitch,流媒体
  - GEOSITE,tiktok,流媒体
  - GEOSITE,disney,流媒体

  # Telegram / Social
  - GEOSITE,telegram,社交媒体
  - GEOSITE,twitter,社交媒体
  - GEOSITE,discord,社交媒体

  - DOMAIN-SUFFIX,t.me,社交媒体
  - DOMAIN-SUFFIX,telegra.ph,社交媒体

  - IP-CIDR,91.108.4.0/22,社交媒体,no-resolve
  - IP-CIDR,91.108.8.0/22,社交媒体,no-resolve
  - IP-CIDR,91.108.12.0/22,社交媒体,no-resolve
  - IP-CIDR,91.108.16.0/22,社交媒体,no-resolve
  - IP-CIDR,91.108.20.0/22,社交媒体,no-resolve
  - IP-CIDR,91.108.56.0/22,社交媒体,no-resolve
  - IP-CIDR,149.154.160.0/20,社交媒体,no-resolve

  # GitHub
  - GEOSITE,github,节点选择

  # Game
  - GEOSITE,steam,游戏平台

  # Google
  - GEOSITE,google,Google服务

  # Microsoft
  - GEOSITE,microsoft,Microsoft服务

  # Apple
  - GEOSITE,apple,Apple服务

  # GFW
  - RULE-SET,U_GFW,节点选择

  # China
  - RULE-SET,U_CN_DOMAIN,DIRECT
  - RULE-SET,U_CN_IP,DIRECT,no-resolve

  # Final
  - MATCH,节点选择
